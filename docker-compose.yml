# Shared by the four Airflow services at the bottom of this file. An anchor
# rather than four copies, because the one thing worse than this much
# configuration is two versions of it that disagree.
#
# Defined up here because YAML anchors have to appear before the aliases that
# use them.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  # Named, so the DAG and the Makefile can refer to the image without knowing
  # what Compose decided to call the project directory.
  image: adtech-airflow:local
  # Every Snowflake and object-store credential the tasks need, from the same
  # file the host tooling reads. Nothing is restated in the DAG, and nothing is
  # stored in Airflow's own connections table - a scheduler database that
  # contains the warehouse password is a backup that leaks one.
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    # Airflow 3 runs tasks through an HTTP execution API rather than letting
    # them reach the metadata database directly. LocalExecutor still needs to
    # be told where that endpoint is, because the default assumes localhost and
    # the scheduler is not the api-server here.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_UI_PORT:-8090}
    # Fixed so sessions and encrypted values survive a restart. Fine for a
    # local stack; on anything shared these come from a secret manager.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-adtech-local-development-only}
    # Separate from the one above, and required. In Airflow 3 a task does not
    # write to the database directly - it calls the api-server back over the
    # execution API, carrying a JWT the scheduler minted for it. This secret
    # signs that token. Its default is random per process, so leaving it unset
    # gives the scheduler and the api-server different keys and every task dies
    # on "Invalid auth token" the moment it tries to report that it started.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-adtech-local-development-only}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # The DAG shells out to `docker compose run spark`, which has to land in
    # this project rather than inventing a second one named after /opt/airflow.
    COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-programmatic-advertising-analytics-platform}
    # Service names, not localhost. .env points the host tooling at published
    # ports; inside the network the containers answer on their own names.
    S3_ENDPOINT: http://minio:9000
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # The project is mounted at its host path (see volumes) rather than
    # installed, so this is what makes `python -m warehouse.load` importable.
    # It precedes site-packages, so the mounted code wins over anything the
    # image happens to carry.
    PYTHONPATH: ${PWD}
    # dbt writes two directories next to dbt_project.yml by default, and the
    # project is mounted read-only, so out of the box `dbt build` dies on its
    # own log file before it opens a connection. Pointing both at a volume
    # keeps the mount read-only - which is the property worth keeping, since
    # it is what stops a scheduler from editing the repo it is running.
    #
    # A volume rather than /tmp because target/ is not scratch: manifest.json
    # and run_results.json are how a run is audited afterwards, and they are
    # worth having from the run before the one that broke.
    DBT_LOG_PATH: /opt/airflow/dbt/logs
    DBT_TARGET_PATH: /opt/airflow/dbt/target
  volumes:
    # The project at *the same path it has on the host*. This looks odd and is
    # load-bearing: `docker compose run` here talks to the host's Docker
    # daemon, and the daemon resolves the Spark service's `./:/app:ro` bind
    # against the host filesystem. Mounted anywhere else, Compose would hand
    # the daemon a path that does not exist and Spark would start with an empty
    # /app.
    - ${PWD}:${PWD}:ro
    - ${PWD}/airflow/dags:/opt/airflow/dags:ro
    - adtech-airflow-logs:/opt/airflow/logs
    - adtech-airflow-dbt:/opt/airflow/dbt
    # How the scheduler starts sibling containers. See docker/airflow.Dockerfile
    # for why this is a real trade and not a free one.
    - /var/run/docker.sock:/var/run/docker.sock
  working_dir: ${PWD}
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16
    container_name: adtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adtech}
      POSTGRES_USER: ${POSTGRES_USER:-adtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adtech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Docker defaults /dev/shm to 64MB. PostgreSQL allocates a shared memory
    # segment per parallel worker, so the analytical joins in the data quality
    # suite exhaust that almost immediately on a million-row table and fail with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: '2gb'
    volumes:
      - adtech-postgres-data:/var/lib/postgresql/data
      # Mounted individually and numbered so the execution order is explicit.
      # postgres/indexes.sql is deliberately absent: it is applied by the loader
      # after the bulk COPY rather than before it.
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command:
      - postgres
      # Logical decoding is what Debezium will consume in phase 2. Setting it here
      # means the source database never has to be restarted later.
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
      # Bulk-load friendly settings for a local development database.
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - synchronous_commit=off
      - -c
      - max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adtech} -d ${POSTGRES_DB:-adtech}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Change data capture (phase 2)
  # ---------------------------------------------------------------------------

  kafka:
    image: apache/kafka:3.8.1
    container_name: adtech-kafka
    restart: unless-stopped
    ports:
      # 9092 is for containers on this network; 29092 is for tools on the host.
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      # KRaft mode: one node acting as both broker and controller, so there is no
      # ZooKeeper to run. Fine for local development, not for production.
      CLUSTER_ID: AdTechPlatformKRaftCluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      # Without this the broker keeps the default from its own
      # config/kraft/server.properties, which is /tmp/kraft-combined-logs - a
      # path inside the container's writable layer, not the volume below. Every
      # topic then survives a restart but is destroyed by `make down`, because
      # that removes the container. The volume sat empty and unnoticed until a
      # shutdown wiped the topics and Connect's own _connect_configs with them,
      # deregistering the connector and leaving the replication slot inactive.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - adtech-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: adtech-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${CONNECT_HOST_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: adtech-connect
      # Connect keeps its own configuration, offsets and status in Kafka. Those
      # offsets are what let it resume from the right place after a restart, which
      # is the foundation of the failure recovery work in phase 17.
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: 10000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: adtech-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: adtech
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: adtech-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------
  # Object storage - the Bronze layer (phase 4)
  # ---------------------------------------------------------------------------

  minio:
    image: minio/minio:latest
    container_name: adtech-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Non-default host ports on purpose: 9000/9001 are already taken by
      # another project's MinIO on this machine, and two object stores
      # answering the same port is a confusing afternoon.
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-adtech}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-adtechadtech}
      # Deliberately no MINIO_DOMAIN. Setting it to the hostname clients connect
      # through makes MinIO parse those requests as virtual-hosted-style, which
      # breaks SigV4 signature validation even with correct credentials.
      # Everything here uses path-style addressing.
    volumes:
      - adtech-bronze-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket on first start so nothing downstream has to handle a
  # missing one. Exits immediately afterwards; that is success, not a crash.
  minio-init:
    image: minio/mc:latest
    container_name: adtech-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set adtech http://minio:9000 ${S3_ACCESS_KEY:-adtech} ${S3_SECRET_KEY:-adtechadtech};
      mc mb --ignore-existing adtech/${BRONZE_BUCKET:-adtech-bronze};
      mc version enable adtech/${BRONZE_BUCKET:-adtech-bronze};
      exit 0;
      "

  # Lands the CDC change stream in Bronze, continuously.
  #
  # Part of the default stack rather than behind a profile: it only reads Kafka
  # and writes object storage, so there is no state it can damage by running.
  # Without it the pipeline is continuous as far as Kafka and manual from there,
  # which is a strange place to stop.
  bronze-sink:
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    container_name: adtech-bronze-sink
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Not just "minio is up" - the sink calls head_bucket on startup and
      # exits if the bucket is missing, so it has to wait for the one-shot
      # init container to have finished creating it.
      minio-init:
        condition: service_completed_successfully
    environment:
      # Inside the network MinIO answers on its own port, not the remapped
      # host one, and `localhost` would be this container.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-adtech}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-adtechadtech}
      S3_REGION: ${S3_REGION:-us-east-1}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-adtech-bronze}
    command:
      - python
      - scripts/bronze.py
      - sink
      # kafka:9092 is the INTERNAL listener; 29092 is only advertised to the host.
      - --bootstrap
      - kafka:9092
      # 0 = never stop when caught up.
      - --idle-timeout
      - "0"
      # Longer than the one-shot default: running all day, the flush timer is
      # what decides how many Parquet objects exist. See docs/bronze.md.
      - --max-seconds
      - "${BRONZE_FLUSH_SECONDS:-900}"
    volumes:
      # Read-only: it reads Kafka and writes Bronze, never the project.
      - ./:/app:ro

  # ---------------------------------------------------------------------------
  # Spark - the Silver layer (phase 5)
  # ---------------------------------------------------------------------------

  # A batch job, not a daemon: `make silver` runs it and it exits. Behind a
  # profile so `make up` does not start it, because a container whose whole
  # purpose is to finish would otherwise sit in `Exited (0)` next to six healthy
  # services and look like a failure.
  #
  # Run with `docker compose run --rm spark ...` rather than `up`, so the exit
  # code reaches the shell and a failed reconciliation fails the Make target.
  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: adtech-spark
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Added in phase 6: the Iceberg catalog keeps its table pointers here, so
      # Spark now needs the database up to read Silver at all, not only to
      # reach the source tables (which it never does - it reads Bronze).
      postgres:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-adtech}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-adtechadtech}
      S3_REGION: ${S3_REGION:-us-east-1}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-adtech-bronze}
      # Service name, not localhost: localhost in this container is this
      # container. The catalog lives in its own database on the same server -
      # see spark/catalog.py for why it is not a schema in adtech.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-adtech}
      POSTGRES_USER: ${POSTGRES_USER:-adtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adtech}
      ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB:-iceberg}
      # Driver memory has to be set before the JVM starts, so it cannot come
      # from SparkConf in local mode - by the time the builder runs, the heap is
      # already sized. PYSPARK_SUBMIT_ARGS is the only hook early enough.
      # `local[*]` uses every core the Docker VM was given.
      PYSPARK_SUBMIT_ARGS: >-
        --master local[*]
        --driver-memory ${SPARK_DRIVER_MEMORY:-4g}
        pyspark-shell
    command:
      - python
      - scripts/silver.py
      - reconcile
    volumes:
      # Read-only like the other services: Spark reads Bronze and writes Silver,
      # both in object storage. Its scratch space is SPARK_LOCAL_DIRS in /tmp.
      - ./:/app:ro

  # ---------------------------------------------------------------------------
  # Continuous change traffic (optional)
  # ---------------------------------------------------------------------------

  # Keeps a trickle of edits flowing so the CDC pipeline always has something to
  # capture, and restarts with the rest of the stack after a reboot.
  #
  # Behind a profile, so `make up` does NOT start it: a service that silently
  # mutates the source tables every time anyone brings the stack up would be a
  # genuinely unpleasant surprise. Start it deliberately with `make traffic-up`.
  #
  # Safe to leave running. The generator's --loop mode pairs every state change
  # with its reverse, so the dataset does not drift the way repeated one-shot
  # runs would - see data_generator/change_generator.py.
  traffic:
    profiles: ["traffic"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    container_name: adtech-traffic
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Set here rather than read from .env: inside the network the database is
      # reachable as `postgres`, not localhost. load_dotenv_file uses setdefault,
      # so these win over anything .env happens to say.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-adtech}
      POSTGRES_USER: ${POSTGRES_USER:-adtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adtech}
    command:
      - python
      - -m
      - data_generator.change_generator
      - --loop
      - --interval
      - "${TRAFFIC_INTERVAL_SECONDS:-60}"
      - --changes-per-batch
      - "${TRAFFIC_CHANGES_PER_BATCH:-20}"
    volumes:
      # Read-only: this container drives the database, it has no business
      # editing the project it is running from.
      - ./:/app:ro

  # ---------------------------------------------------------------------------
  # Airflow (phase 14)
  # ---------------------------------------------------------------------------

  # Behind a profile, so `make up` does not start five more containers for a
  # pipeline most commands here drive by hand. `make airflow-up` starts it.
  #
  # Airflow 3 splits what 2.x ran in one process: the scheduler decides what to
  # run, a separate dag-processor parses DAG files, and the api-server serves
  # both the UI and the task execution API the workers call back on. They are
  # listed separately rather than hidden behind `airflow standalone` because
  # standalone is a development shortcut that hides exactly the architecture
  # this phase is about.
  #
  # The triggerer is deliberately absent. It exists to run deferrable operators,
  # and nothing here defers - every task is a subprocess that either finishes or
  # fails. Running one anyway would be a sixth idle container.

  # Airflow's own metadata database, and emphatically not the one in `postgres`
  # above. That one is the CDC source: Debezium is streaming its WAL to Kafka,
  # so putting Airflow's task history in it would push scheduler bookkeeping
  # through the pipeline and into Bronze. A separate server is the only way to
  # keep the two apart.
  airflow-postgres:
    profiles: ["airflow"]
    image: postgres:16
    container_name: adtech-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - adtech-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs the schema migration and exits. Exiting is success, not a crash - the
  # same arrangement as minio-init.
  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: adtech-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: ["db", "migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: adtech-airflow-apiserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      # Not 8080: the Kafka UI already has it. Airflow's internal port stays
      # 8080, because the execution API URL below has to agree with it.
      - "${AIRFLOW_UI_PORT:-8090}:8080"
    command: ["api-server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: adtech-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: adtech-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["dag-processor"]

volumes:
  adtech-postgres-data:
  adtech-kafka-data:
  adtech-bronze-data:
  adtech-airflow-data:
  adtech-airflow-logs:
  adtech-airflow-dbt:
