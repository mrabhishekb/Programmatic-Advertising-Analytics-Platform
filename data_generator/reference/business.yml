# Business vocabulary and the conditional weights that keep attribute combinations
# plausible. Everything here is data, not code: changing a weight changes the shape
# of the generated ecosystem without touching the generator.
#
# *_index values are multipliers applied on top of a baseline (1.0 = average).

industries:
  - {name: Retail,               group: Commerce,      weight: 14.0, roas_index: 1.15, ctr_index: 1.05}
  - {name: Ecommerce,            group: Commerce,      weight: 12.0, roas_index: 1.25, ctr_index: 1.10}
  - {name: Consumer Electronics, group: Commerce,      weight: 6.0,  roas_index: 1.05, ctr_index: 0.95}
  - {name: Fashion,              group: Commerce,      weight: 7.0,  roas_index: 1.10, ctr_index: 1.20}
  - {name: Automotive,           group: Consumer,      weight: 5.0,  roas_index: 0.80, ctr_index: 0.75}
  - {name: Travel,               group: Consumer,      weight: 6.5,  roas_index: 1.20, ctr_index: 1.15}
  - {name: Food and Beverage,    group: Consumer,      weight: 5.5,  roas_index: 0.95, ctr_index: 1.10}
  - {name: Financial Services,   group: Regulated,     weight: 8.0,  roas_index: 0.75, ctr_index: 0.60}
  - {name: Insurance,            group: Regulated,     weight: 4.0,  roas_index: 0.70, ctr_index: 0.55}
  - {name: Healthcare,           group: Regulated,     weight: 4.5,  roas_index: 0.85, ctr_index: 0.65}
  - {name: Pharmaceuticals,      group: Regulated,     weight: 2.0,  roas_index: 0.65, ctr_index: 0.50}
  - {name: Telecommunications,   group: Services,      weight: 4.0,  roas_index: 0.90, ctr_index: 0.80}
  - {name: Software,             group: Technology,    weight: 7.5,  roas_index: 1.05, ctr_index: 0.90}
  - {name: Gaming,               group: Technology,    weight: 5.0,  roas_index: 1.30, ctr_index: 1.45}
  - {name: Education,            group: Services,      weight: 3.5,  roas_index: 0.85, ctr_index: 0.85}
  - {name: Media and Streaming,  group: Media,         weight: 3.5,  roas_index: 1.00, ctr_index: 1.25}
  - {name: Real Estate,          group: Services,      weight: 1.5,  roas_index: 0.75, ctr_index: 0.70}
  - {name: Nonprofit,            group: Public Sector, weight: 0.5,  roas_index: 0.55, ctr_index: 0.90}

advertiser_status_weights:
  ACTIVE: 86.0
  SUSPENDED: 9.0
  CLOSED: 5.0

# Spend tiers drive how many campaigns an advertiser runs, how large the budgets are
# and how much traffic the campaigns attract.
advertiser_tiers:
  - {name: ENTERPRISE, weight: 5.0,  budget_index: 12.0, volume_index: 9.0,  campaign_index: 5.0}
  - {name: MID_MARKET, weight: 25.0, budget_index: 3.0,  volume_index: 2.5,  campaign_index: 2.0}
  - {name: SMB,        weight: 70.0, budget_index: 1.0,  volume_index: 1.0,  campaign_index: 1.0}

campaign_objective_weights:
  AWARENESS: 20.0
  TRAFFIC: 26.0
  ENGAGEMENT: 14.0
  CONVERSIONS: 32.0
  APP_INSTALLS: 8.0

campaign_status_weights:
  DRAFT: 5.0
  ACTIVE: 42.0
  PAUSED: 14.0
  COMPLETED: 33.0
  CANCELLED: 6.0

# Bid strategy is not independent of the objective: an awareness campaign buys
# reach on a CPM basis, a conversions campaign optimises towards CPA / ROAS.
bid_strategy_by_objective:
  AWARENESS:    {CPM: 80.0, CPC: 15.0, CPA: 1.0,  TARGET_ROAS: 2.0,  MAX_CONVERSIONS: 2.0}
  TRAFFIC:      {CPM: 20.0, CPC: 68.0, CPA: 5.0,  TARGET_ROAS: 3.0,  MAX_CONVERSIONS: 4.0}
  ENGAGEMENT:   {CPM: 35.0, CPC: 50.0, CPA: 6.0,  TARGET_ROAS: 4.0,  MAX_CONVERSIONS: 5.0}
  CONVERSIONS:  {CPM: 5.0,  CPC: 12.0, CPA: 38.0, TARGET_ROAS: 25.0, MAX_CONVERSIONS: 20.0}
  APP_INSTALLS: {CPM: 6.0,  CPC: 14.0, CPA: 55.0, TARGET_ROAS: 5.0,  MAX_CONVERSIONS: 20.0}

optimization_goal_by_objective:
  AWARENESS:    {REACH: 55.0, IMPRESSIONS: 35.0, CLICKS: 8.0,  CONVERSIONS: 1.0,  REVENUE: 1.0}
  TRAFFIC:      {CLICKS: 75.0, IMPRESSIONS: 12.0, REACH: 6.0,  CONVERSIONS: 5.0,  REVENUE: 2.0}
  ENGAGEMENT:   {CLICKS: 55.0, IMPRESSIONS: 18.0, REACH: 12.0, CONVERSIONS: 12.0, REVENUE: 3.0}
  CONVERSIONS:  {CONVERSIONS: 62.0, REVENUE: 25.0, CLICKS: 10.0, IMPRESSIONS: 2.0, REACH: 1.0}
  APP_INSTALLS: {CONVERSIONS: 70.0, CLICKS: 18.0, REVENUE: 6.0, IMPRESSIONS: 4.0, REACH: 2.0}

conversion_type_by_objective:
  AWARENESS:    {SIGNUP: 35.0, LEAD: 30.0, PURCHASE: 25.0, SUBSCRIPTION: 8.0,  APP_INSTALL: 2.0}
  TRAFFIC:      {PURCHASE: 40.0, SIGNUP: 30.0, LEAD: 20.0, SUBSCRIPTION: 8.0,  APP_INSTALL: 2.0}
  ENGAGEMENT:   {SIGNUP: 40.0, LEAD: 30.0, PURCHASE: 20.0, SUBSCRIPTION: 8.0,  APP_INSTALL: 2.0}
  CONVERSIONS:  {PURCHASE: 55.0, SIGNUP: 18.0, LEAD: 15.0, SUBSCRIPTION: 11.0, APP_INSTALL: 1.0}
  APP_INSTALLS: {APP_INSTALL: 92.0, SUBSCRIPTION: 5.0, PURCHASE: 2.0, SIGNUP: 1.0, LEAD: 0.0}

