creative_status_weights:
  ACTIVE: 72.0
  PAUSED: 14.0
  REJECTED: 6.0
  EXPIRED: 8.0

# A rejected creative never serves. The generator enforces that every advertiser
# keeps at least one servable creative.
creative_servable_statuses: [ACTIVE, PAUSED, EXPIRED]

publisher_type_weights:
  WEBSITE: 50.0
  MOBILE_APP: 31.0
  CTV: 12.0
  AUDIO: 7.0

publisher_status_weights:
  ACTIVE: 90.0
  SUSPENDED: 7.0
  CLOSED: 3.0

# Placement inventory is conditioned on what the publisher actually is: a CTV
# property does not sell sidebar banners.
placement_type_by_publisher_type:
  WEBSITE:    {HEADER: 30.0, SIDEBAR: 24.0, IN_FEED: 26.0, VIDEO_PRE_ROLL: 13.0, VIDEO_MID_ROLL: 7.0}
  MOBILE_APP: {APP_BANNER: 44.0, APP_INTERSTITIAL: 30.0, IN_FEED: 18.0, VIDEO_PRE_ROLL: 8.0}
  CTV:        {VIDEO_PRE_ROLL: 55.0, VIDEO_MID_ROLL: 45.0}
  AUDIO:      {VIDEO_PRE_ROLL: 60.0, VIDEO_MID_ROLL: 40.0}

ad_format_by_placement_type:
  HEADER:           {DISPLAY_LEADERBOARD: 60.0, DISPLAY_BILLBOARD: 40.0}
  SIDEBAR:          {DISPLAY_MREC: 55.0, DISPLAY_SKYSCRAPER: 45.0}
  IN_FEED:          {NATIVE_IN_FEED: 62.0, DISPLAY_MREC: 38.0}
  VIDEO_PRE_ROLL:   {VIDEO_INSTREAM: 70.0, AUDIO_INSTREAM: 30.0}
  VIDEO_MID_ROLL:   {VIDEO_INSTREAM: 72.0, AUDIO_INSTREAM: 28.0}
  APP_BANNER:       {DISPLAY_MOBILE_BANNER: 100.0}
  APP_INTERSTITIAL: {DISPLAY_INTERSTITIAL: 55.0, VIDEO_INTERSTITIAL: 45.0}

# Audio formats only make sense on audio publishers, so the format choice is
# narrowed once the publisher type is known.
ad_format_overrides_by_publisher_type:
  AUDIO:
    VIDEO_PRE_ROLL: {AUDIO_INSTREAM: 100.0}
    VIDEO_MID_ROLL: {AUDIO_INSTREAM: 100.0}
  CTV:
    VIDEO_PRE_ROLL: {VIDEO_INSTREAM: 100.0}
    VIDEO_MID_ROLL: {VIDEO_INSTREAM: 100.0}
  WEBSITE:
    VIDEO_PRE_ROLL: {VIDEO_INSTREAM: 100.0}
    VIDEO_MID_ROLL: {VIDEO_INSTREAM: 100.0}
  MOBILE_APP:
    VIDEO_PRE_ROLL: {VIDEO_INSTREAM: 100.0}

