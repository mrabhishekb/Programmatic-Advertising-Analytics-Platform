  ACTIVE: 52.0
  PAUSED: 13.0
  COMPLETED: 26.0
  CANCELLED: 5.0

creative_type_weights:
  BANNER: 52.0
  VIDEO: 26.0
  NATIVE: 17.0
  AUDIO: 5.0

creative_format_by_type:
  BANNER: {"300x250": 30.0, "728x90": 22.0, "320x50": 18.0, "160x600": 10.0, "970x250": 10.0, "300x600": 10.0}
  VIDEO:  {"VIDEO_16x9_15S": 34.0, "VIDEO_16x9_30S": 30.0, "VIDEO_9x16_15S": 22.0, "VIDEO_1x1_06S": 14.0}
  NATIVE: {"NATIVE_IN_FEED": 45.0, "NATIVE_CONTENT": 30.0, "NATIVE_CAROUSEL": 25.0}
