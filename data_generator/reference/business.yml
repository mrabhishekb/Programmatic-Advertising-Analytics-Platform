# In-app traffic reports a generic in-app browser rather than a real browser.
in_app_placement_types: [APP_BANNER, APP_INTERSTITIAL]

# Which inventory a creative can physically run on.
placement_types_by_creative_type:
  BANNER: [HEADER, SIDEBAR, IN_FEED, APP_BANNER, APP_INTERSTITIAL]
  VIDEO: [VIDEO_PRE_ROLL, VIDEO_MID_ROLL, APP_INTERSTITIAL]
  NATIVE: [IN_FEED, SIDEBAR, APP_BANNER]
  AUDIO: [VIDEO_PRE_ROLL, VIDEO_MID_ROLL]

# Audio creatives may only run on inventory that actually serves audio.
ad_formats_by_creative_type:
  BANNER: [DISPLAY_LEADERBOARD, DISPLAY_BILLBOARD, DISPLAY_MREC, DISPLAY_SKYSCRAPER,
           DISPLAY_MOBILE_BANNER, DISPLAY_INTERSTITIAL]
  VIDEO: [VIDEO_INSTREAM, VIDEO_INTERSTITIAL]
  NATIVE: [NATIVE_IN_FEED, DISPLAY_MREC, DISPLAY_MOBILE_BANNER]
  AUDIO: [AUDIO_INSTREAM]

# Placement-level performance and pricing characteristics.
# ctr_index    : relative click-through rate
# view_alpha/beta : Beta distribution shaping the viewability score
# cpm_index    : relative floor price / clearing price level
placement_type_profile:
  HEADER:           {ctr_index: 0.85, view_alpha: 6.0, view_beta: 2.2, cpm_index: 1.10}
  SIDEBAR:          {ctr_index: 0.55, view_alpha: 3.0, view_beta: 3.4, cpm_index: 0.75}
  IN_FEED:          {ctr_index: 1.30, view_alpha: 5.0, view_beta: 2.4, cpm_index: 1.00}
  VIDEO_PRE_ROLL:   {ctr_index: 1.05, view_alpha: 8.0, view_beta: 1.8, cpm_index: 1.85}
  VIDEO_MID_ROLL:   {ctr_index: 0.80, view_alpha: 7.0, view_beta: 2.0, cpm_index: 1.60}
  APP_BANNER:       {ctr_index: 1.45, view_alpha: 4.5, view_beta: 2.6, cpm_index: 0.70}
  APP_INTERSTITIAL: {ctr_index: 2.20, view_alpha: 9.0, view_beta: 1.5, cpm_index: 1.35}

device_profile:
