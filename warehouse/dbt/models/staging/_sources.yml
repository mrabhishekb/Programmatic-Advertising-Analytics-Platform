version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ADTECH') }}"
    schema: RAW
    description: >
      Landing copy of the Iceberg Silver layer, written by `make warehouse-load`.
      One table per Silver table, every column carried through including the
      soft-delete flags and the CDC lineage columns. Nothing transforms RAW in
      place, so re-running the loader is the only thing that changes it.

    config:
      # Freshness is measured on _EVENT_TS, the moment the source change
      # actually happened, rather than on load time. Load time only says the
      # loader ran; this says how stale the warehouse is, which is the question.
      loaded_at_field: _EVENT_TS
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: ADVERTISERS
        description: Companies buying advertising. The top of the hierarchy.
        columns:
          - name: ADVERTISER_ID
            description: Natural key, a UUID from the source system.
            tests: [unique, not_null]

      - name: CAMPAIGNS
        description: An advertiser's spending plan over a flight window.
        columns:
          - name: CAMPAIGN_ID
            tests: [unique, not_null]
          - name: ADVERTISER_ID
            tests:
              - not_null
              - relationships:
                  arguments:
                      to: source('raw', 'ADVERTISERS')
                      field: ADVERTISER_ID

      - name: LINE_ITEMS
        description: The bidding unit within a campaign.
        columns:
          - name: LINE_ITEM_ID
            tests: [unique, not_null]
          - name: CAMPAIGN_ID
            tests:
              - not_null
              - relationships:
                  arguments:
                      to: source('raw', 'CAMPAIGNS')
                      field: CAMPAIGN_ID

      - name: CREATIVES
        description: The advertisement itself, owned by an advertiser.
        columns:
          - name: CREATIVE_ID
            tests: [unique, not_null]
          - name: ADVERTISER_ID
            tests:
              - not_null
              - relationships:
                  arguments:
                      to: source('raw', 'ADVERTISERS')
                      field: ADVERTISER_ID

      - name: PUBLISHERS
        description: Sites and apps selling inventory.
        columns:
          - name: PUBLISHER_ID
            tests: [unique, not_null]

      - name: PLACEMENTS
        description: A specific ad slot on a publisher's property.
        columns:
          - name: PLACEMENT_ID
            tests: [unique, not_null]
          - name: PUBLISHER_ID
            tests:
              - not_null
              - relationships:
                  arguments:
                      to: source('raw', 'PUBLISHERS')
                      field: PUBLISHER_ID

      - name: AUDIENCES
        description: Targeting segments. The only dimension that is routinely deleted.
        columns:
          - name: AUDIENCE_ID
            tests: [unique, not_null]

      # ---------------------------------------------------------------------
      # The event tables (phase 12)
      #
      # Append-only and never captured by Debezium - they reach Silver through
      # the bulk export instead, which is why their lineage columns are null on
      # every row and why freshness is disabled below. `_EVENT_TS` is the
      # moment a *change event* happened, and these rows are not changes.
      #
      # Identity is asserted here and nowhere else above it. On a dimension the
      # same `unique` at source, staging and core costs nothing and catches
      # different failures. At 100 million rows it is three full aggregations
      # per build to make one claim, so it is made once, closest to the COPY
      # that could break it. Referential integrity is asserted once too, on the
      # facts, where the surrogate keys it is really about are built.
      # ---------------------------------------------------------------------

      - name: IMPRESSIONS
        description: >
          One row per ad served. The largest table in the project at 100M rows,
          and the reason the event tables are opt-in everywhere upstream.
        config:
          freshness: null
        columns:
          - name: IMPRESSION_ID
            tests: [unique, not_null]

      - name: CLICKS
        description: >
          One row per click, always derived from an impression. Campaign, line
          item, advertiser and creative are inherited from that impression
          rather than re-derived.
        config:
          freshness: null
        columns:
          - name: CLICK_ID
            tests: [unique, not_null]

      - name: CONVERSIONS
        description: One row per conversion, attributed last-click to a campaign.
        config:
          freshness: null
        columns:
          - name: CONVERSION_ID
            tests: [unique, not_null]

      - name: SPEND_TRANSACTIONS
        description: >
          One row per billable charge. Three grains in one table, told apart by
          BILLING_TYPE: CPM is per campaign/line item/publisher/hour, CPC is per
          click, CPA is per conversion.
        config:
          freshness: null
        columns:
          - name: SPEND_TRANSACTION_ID
            tests: [unique, not_null]
