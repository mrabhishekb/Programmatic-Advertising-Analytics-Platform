version: 2

models:
  - name: stg_advertisers
    description: >
      Companies buying advertising, renamed and typed. Every row RAW holds,
      including soft-deleted ones; filtering is a question for the layer that
      reports, not for the layer that types.
    columns:
      - name: advertiser_id
        description: Natural key from the source system.
        tests: [unique, not_null]
      - name: account_status
        description: Mirrors the CHECK constraint in postgres/schema.sql.
        tests:
          - accepted_values:
              arguments:
                  values: [ACTIVE, SUSPENDED, CLOSED]
      - name: is_deleted
        description: >
          Carried forward from Silver and into the core dimensions, where it
          becomes the current-state filter.

  - name: stg_campaigns
    description: An advertiser's spending plan over a flight window.
    columns:
      - name: campaign_id
        tests: [unique, not_null]
      - name: advertiser_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_advertisers')
                  field: advertiser_id
      - name: daily_budget
        description: >
          One of the two columns the change generator edits, so it is the
          column that proves CDC updates arrive. Money, carried as NUMBER(14,2)
          rather than a float all the way from PostgreSQL.
        tests: [not_null]
      - name: campaign_status
        tests:
          - accepted_values:
              arguments:
                  values: [DRAFT, ACTIVE, PAUSED, COMPLETED, CANCELLED]

  - name: stg_line_items
    description: The bidding unit within a campaign.
    columns:
      - name: line_item_id
        tests: [unique, not_null]
      - name: campaign_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_campaigns')
                  field: campaign_id
      - name: bid_amount
        tests: [not_null]
      - name: line_item_status
        tests:
          - accepted_values:
              arguments:
                  values: [DRAFT, ACTIVE, PAUSED, COMPLETED, CANCELLED]

  - name: stg_creatives
    description: The advertisement itself, owned by an advertiser.
    columns:
      - name: creative_id
        tests: [unique, not_null]
      - name: advertiser_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_advertisers')
                  field: advertiser_id
      - name: creative_type
        tests:
          - accepted_values:
              arguments:
                  values: [BANNER, VIDEO, NATIVE, AUDIO]
      - name: creative_status
        tests:
          - accepted_values:
              arguments:
                  values: [ACTIVE, PAUSED, REJECTED, EXPIRED]

  - name: stg_publishers
    description: Sites and apps selling inventory.
    columns:
      - name: publisher_id
        tests: [unique, not_null]
      - name: publisher_type
        tests:
          - accepted_values:
              arguments:
                  values: [WEBSITE, MOBILE_APP, CTV, AUDIO]
      - name: publisher_status
        tests:
          - accepted_values:
              arguments:
                  values: [ACTIVE, SUSPENDED, CLOSED]

  - name: stg_placements
    description: A specific ad slot on a publisher's property.
    columns:
      - name: placement_id
        tests: [unique, not_null]
      - name: publisher_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_publishers')
                  field: publisher_id
      - name: floor_price
        tests: [not_null]

  - name: stg_audiences
    description: >
      Targeting segments. The dimension most affected by soft deletes, and the
      reason staging stopped filtering them: the impressions that targeted a
      deleted segment are still in the warehouse and still need somewhere to
      join.
    columns:
      - name: audience_id
        tests: [unique, not_null]
      - name: audience_type
        tests:
          - accepted_values:
              arguments:
                  values: [DEMOGRAPHIC, INTEREST, BEHAVIORAL, LOOKALIKE, RETARGETING]
      - name: min_age
        tests: [not_null]
      - name: max_age
        tests: [not_null]
    tests:
      # The one staging assertion that is not a column constraint. An age band
      # whose floor is above its ceiling targets nobody, and would silently
      # produce zero-row joins in phase 12 rather than an error.
      - dbt_utils.expression_is_true:
          arguments:
              expression: "min_age <= max_age"

  # ---------------------------------------------------------------------------
  # The event tables (phase 12)
  #
  # Documented here but barely tested here. Identity is asserted once at the
  # source and referential integrity once on the facts; repeating either at this
  # layer would be a third full pass over 100 million rows to make a claim that
  # has already been made. The dimensions above can afford that repetition
  # because they are five orders of magnitude smaller.
  # ---------------------------------------------------------------------------

  - name: stg_impressions
    description: >
      One row per ad served, 100M of them. Lineage columns are null on every
      row: append-only tables bypass Debezium and arrive through the bulk
      export, so no change event stands behind them.
    columns:
      - name: impression_id
        description: Natural key, and a degenerate dimension on fct_impressions.
      - name: bid_price
        description: What we bid, as a CPM. Not the cost of this impression.
      - name: clearing_price
        description: >
          What we paid, as a CPM - a price per thousand. Dividing by 1000 is
          what turns it into the cost of this one impression, which fct_impressions
          does once so nobody has to remember to.
      - name: viewability_score
        description: >
          0 to 1. Non-additive: summing it is meaningless and averaging it
          across impressions of different durations is only roughly right.

  - name: stg_clicks
    description: One row per click, always derived from an impression.
    columns:
      - name: click_id
        description: Natural key.
      - name: impression_id
        description: >
          The impression this click came from. Carried rather than dropped as
          redundant, because the chain the intermediate layer walks starts
          here.

  - name: stg_conversions
    description: One row per conversion, attributed last-click to a campaign.
    columns:
      - name: conversion_id
        description: Natural key.
      - name: conversion_value
        description: Revenue, NUMBER(14,2). Additive across every dimension.
      - name: attribution_window_hours
        description: >
          A number that is not a measure. It records the setting in force when
          the conversion was attributed; averaging it describes the settings,
          not the business.

  - name: stg_spend_transactions
    description: >
      One row per billable charge, at three different grains distinguished by
      billing_type.
    columns:
      - name: spend_transaction_id
        description: Natural key.
      - name: impression_id
        description: >
          Null for CPM spend, which is an hourly rollup with no single
          impression behind it. The only nullable foreign key in the source
          schema, and what the unknown member in dim_* exists to absorb.
      - name: spend_amount
        description: Money actually billed, NUMBER(14,6). Additive.
      - name: billing_type
        description: CPM, CPC or CPA - and the column that says which grain a row is at.
        tests:
          - accepted_values:
              arguments:
                  values: [CPM, CPC, CPA]
